[tool.poetry]
name = "schemavcs"
version = "0.1.0"
description = "Version control for database schemas: branch, diff, and merge structure — not row data."
authors = ["Hari <hariprasad36825@gmail.com>"]
packages = [
  { include = "schemavcs", from = "src" },
  { include = "schemavcs_web", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
lark = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[tool.poetry.scripts]
schemavcs = "schemavcs.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
